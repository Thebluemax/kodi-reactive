@if (isLoading()) {
  <ion-progress-bar type="indeterminate" />
}

<ion-content class="flex-tile-list scroll-list">
  <ion-list>
    @for (artist of artists(); track artist.artistId) {
      <ion-card
        class="tile"
        [style.backgroundImage]="
          'url(\'' +
          (artist.thumbnail | assets) +
          '\'), url(assets/site/no_cover.png)'
        "
        [style.backgroundSize]="artist.thumbnail ? 'auto 100%' : 'cover'"
        [style.backgroundPosition]="artist.thumbnail ? 'center' : 'top'"
      >
        <ion-card-header (click)="onArtistClick(artist)">
          <ion-card-title>{{ artist.name }}</ion-card-title>
        </ion-card-header>
      </ion-card>
    } @empty {
      @if (!isLoading()) {
        <app-empty-state
          icon="people" message="No hay artistas en la biblioteca"
          [error]="loadError()"
          (retry)="onRetry()"
        />
      }
    }
  </ion-list>

  <ion-infinite-scroll (ionInfinite)="onInfiniteScroll($any($event))">
    <ion-infinite-scroll-content loadingSpinner="bubbles" />
  </ion-infinite-scroll>
</ion-content>

<app-lateral-panel
  [panelId]="'artistDetail'"
  [title]="selectedArtist()?.name ?? ''"
  [isOpen]="isPanelOpen()"
  [customWidth]="'60%'"
  (panelClosed)="onClosePanel()"
>
  <app-artist-detail
    [artist]="selectedArtist()"
    [albums]="albums()"
    (editRequested)="onEditRequested($event)"
  />
</app-lateral-panel>

<!--
  Fuera del cajon lateral: se saca a si mismo a document.body, asi que ningun
  modal montado dentro de la aplicacion queda por encima de el.
-->
<ion-modal
  [isOpen]="artistBeingEdited() !== null"
  (ionModalDidDismiss)="onEditCancelled()"
>
  <ng-template>
    <app-media-edit-modal
      [title]="'Editar ' + (artistBeingEdited()?.name ?? '')"
      [schema]="editSchema"
      [value]="editValue()"
      [artwork]="editArtwork()"
      [saving]="isSaving()"
      (save)="onEditSave($event)"
      (cancelled)="onEditCancelled()"
    />
  </ng-template>
</ion-modal>
