@if (isLoading()) {
  <ion-progress-bar type="indeterminate" />
}

<ion-content class="album-list scroll-list">
  <ion-list class="album-list__grid">
    @for (album of albums(); track album.albumId) {
      <app-media-tile
        [title]="album.title"
        [subtitle]="album.artists.join(', ')"
        [thumbnail]="album.thumbnail"
        [year]="album.year"
        [item]="album"
        [showActionButtons]="true"
        (itemSelected)="onAlbumSelected($event)"
        (addToPlaylist)="onAddToPlaylist($event)"
      />
    } @empty {
      @if (!isLoading()) {
        <app-empty-state icon="disc" message="No hay álbumes en la biblioteca" />
      }
    }
  </ion-list>

  <ion-infinite-scroll (ionInfinite)="onInfiniteScroll($any($event))">
    <ion-infinite-scroll-content loadingSpinner="bubbles" />
  </ion-infinite-scroll>
</ion-content>

<app-lateral-panel
  [panelId]="'album-detail'"
  [isOpen]="isPanelOpen()"
  [title]="selectedAlbum()?.title ?? ''"
  [customWidth]="'60%'"
  (panelClosed)="onPanelClosed()"
>
  @if (selectedAlbum()) {
    <app-album-detail
      [album]="selectedAlbum()!"
      [tracks]="tracks()"
      (trackSelected)="onTrackAddToPlaylist($event)"
      (editRequested)="onEditRequested($event)"
    />
  }
</app-lateral-panel>

<!--
  Fuera del panel lateral a proposito: un ion-modal inline se queda donde se
  declara, y dentro del panel heredaba su contexto de apilamiento y su overflow.
-->
<ion-modal
  [isOpen]="albumBeingEdited() !== null"
  (ionModalDidDismiss)="onEditCancelled()"
>
  <ng-template>
    <app-media-edit-modal
      [title]="'Editar ' + (albumBeingEdited()?.title ?? '')"
      [schema]="editSchema"
      [value]="editValue()"
      [saving]="isSaving()"
      (save)="onEditSave($event)"
      (cancelled)="onEditCancelled()"
    />
  </ng-template>
</ion-modal>
