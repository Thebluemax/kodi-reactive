@if (isLoading()) {
  <ion-progress-bar type="indeterminate" />
}

<ion-content class="movie-list scroll-list">
  <ion-list class="movie-list__grid">
    @for (movie of movies(); track movie.movieId) {
      <app-media-tile
        [title]="movie.title"
        [subtitle]="movie.genre.join(', ')"
        imageFit="height"
        [thumbnail]="movie.fanart"
        [year]="movie.year"
        [item]="movie"
        [showActionButtons]="true"
        (itemSelected)="onMovieSelected($event)"
        (addToPlaylist)="onAddToPlaylist($event)"
      />
    } @empty {
      @if (!isLoading()) {
        <app-empty-state
          icon="film-outline" message="No hay películas en la biblioteca"
          [error]="loadError()"
          (retry)="onRetry()"
        />
      }
    }
  </ion-list>

  <ion-infinite-scroll (ionInfinite)="onInfiniteScroll($any($event))">
    <ion-infinite-scroll-content loadingSpinner="bubbles" />
  </ion-infinite-scroll>
</ion-content>

<app-lateral-panel
  [panelId]="'movie-detail'"
  [isOpen]="isPanelOpen()"
  [title]="panelTitle()"
  [customWidth]="'60%'"
  (panelClosed)="onPanelClosed()"
>
  @if (panelType() === 'movie' && selectedMovie()) {
    <app-movie-detail
      [movie]="selectedMovie()!"
      (playMovie)="
        onAddToPlaylist({ media: selectedMovie()!, playMedia: true })
      "
      (addToQueue)="
        onAddToPlaylist({ media: selectedMovie()!, playMedia: false })
      "
      (actorSelected)="onActorSelectedFromMovie($event)"
      (editRequested)="onEditRequested($event)"
      (refreshRequested)="onRefreshRequested($event)"
      (reloadRequested)="onReloadRequested($event)"
    />
  }

  @if (panelType() === 'actor' && selectedActor()) {
    <app-actor-detail
      [actor]="selectedActor()!"
      [movies]="actorMovies()"
      (movieSelected)="onMovieSelectedFromActor($event)"
      (playMovie)="onPlayMovieFromActor($event)"
    />
  }
</app-lateral-panel>

<!--
  Fuera del panel lateral: se saca a si mismo a document.body, asi que ningun
  modal montado dentro de la aplicacion queda por encima de el.
-->
<ion-modal
  [isOpen]="movieBeingEdited() !== null"
  (ionModalDidDismiss)="onEditCancelled()"
>
  <ng-template>
    <app-media-edit-modal
      [title]="'Editar ' + (movieBeingEdited()?.title ?? '')"
      [schema]="editSchema"
      [value]="editValue()"
      [artwork]="editArtwork()"
      [saving]="isSaving()"
      (save)="onEditSave($event)"
      (cancelled)="onEditCancelled()"
    />
  </ng-template>
</ion-modal>

<ion-modal
  [isOpen]="movieBeingRefreshed() !== null"
  (ionModalDidDismiss)="onRefreshCancelled()"
>
  <ng-template>
    <app-media-refresh-modal
      [initial]="refreshValue()"
      [showYear]="true"
      [showUniqueId]="true"
      (confirmed)="onRefreshConfirmed($event)"
      (cancelled)="onRefreshCancelled()"
    />
  </ng-template>
</ion-modal>
